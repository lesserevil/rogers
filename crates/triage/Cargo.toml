[package]
name = "rogers-triage"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rogers-core = { path = "../core" }
rogers-feature-bug = { path = "../feature_bug" }
rogers-github = { path = "../github" }
rogers-llm = { path = "../llm" }
serde = { version = "1.0", features = ["derive"] }
