[package]
name = "rogers"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rogers"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
rogers-beads = { path = "crates/beads" }
rogers-core = { path = "crates/core" }
rogers-feature-bug = { path = "crates/feature_bug" }
rogers-github = { path = "crates/github" }
rogers-llm = { path = "crates/llm" }
rogers-triage = { path = "crates/triage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.12"
thiserror = "1.0"
tracing = "0.1"

[workspace]
members = [
    "crates/core",
    "crates/github",
    "crates/beads",
    "crates/llm",
    "crates/triage",
    "crates/feature_bug",
]

# Build flags for the workspace
[workspace.metadata]
